<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF to Base64 Converter</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 700px; margin: 60px auto; padding: 20px; background: #f5f7fa; }
        .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        h1 { color: #2c3e50; margin-bottom: 8px; }
        p { color: #64748b; margin-bottom: 20px; }
        input[type="file"] { padding: 12px; border: 2px dashed #cbd5e1; border-radius: 8px; width: 100%; margin-bottom: 16px; background: #f8fafc; }
        button { padding: 12px 24px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 16px; padding: 12px; border-radius: 6px; display: none; font-size: 0.9rem; }
        .status.ok { background: #dcfce7; color: #166534; display: block; }
        .status.err { background: #fee2e2; color: #991b1b; display: block; }
        .info { margin-top: 12px; font-size: 0.85rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <h1>PDF → Base64 轉換工具</h1>
        <p>將 <code>SiteDiaryDSD.pdf</code> 轉成可內嵌的 JavaScript 檔案</p>

        <input type="file" id="pdf-input" accept=".pdf">
        <button id="convert-btn" disabled>轉換並下載</button>
        <div class="status" id="status"></div>
        <div class="info" id="info"></div>
    </div>

    <script>
    var input = document.getElementById('pdf-input');
    var btn = document.getElementById('convert-btn');
    var statusEl = document.getElementById('status');
    var infoEl = document.getElementById('info');

    input.addEventListener('change', function () {
        btn.disabled = !input.files || !input.files[0];
        statusEl.className = 'status';
        infoEl.textContent = input.files && input.files[0] ? '已選擇：' + input.files[0].name + ' (' + (input.files[0].size / 1024).toFixed(1) + ' KB)' : '';
    });

    btn.addEventListener('click', function () {
        var file = input.files && input.files[0];
        if (!file) return;

        statusEl.className = 'status';
        statusEl.textContent = '讀取中...';

        var reader = new FileReader();
        reader.onload = function (e) {
            var dataUrl = e.target.result || '';
            var base64 = dataUrl.indexOf(',') !== -1 ? dataUrl.split(',')[1] : dataUrl;

            // 生成 JS 檔案
            var js = '/**\n';
            js += ' * dsd-template-data.js\n';
            js += ' * 自動生成：' + new Date().toISOString() + '\n';
            js += ' * 來源：' + file.name + '\n';
            js += ' */\n';
            js += 'window.SITE_DIARY_TEMPLATE_BASE64 = "' + base64 + '";\n';

            // 下載
            var blob = new Blob([js], { type: 'application/javascript;charset=utf-8' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'dsd-template-data.js';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);

            statusEl.className = 'status ok';
            statusEl.textContent = '✅ 已生成 dsd-template-data.js，大小約 ' + (js.length / 1024).toFixed(1) + ' KB';
            infoEl.innerHTML = '下一步：把下載的 <code>dsd-template-data.js</code> 放到 <code>scripts/</code> 目錄，然後在 <code>editdsdsitediary.html</code> 引入。';
        };
        reader.onerror = function () {
            statusEl.className = 'status err';
            statusEl.textContent = '❌ 讀取失敗';
        };
        reader.readAsDataURL(file);
    });
    </script>
</body>
</html>
