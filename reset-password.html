<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AEL DWSS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="scripts/password.js"></script>
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { background: white; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); padding: 40px 32px; width: 100%; max-width: 420px; }
        .login-card h2 { color: #2c3e50; text-align: center; margin-bottom: 8px; }
        .login-card p { color: #7f8c8d; text-align: center; font-size: 0.9rem; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #2c3e50; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        .form-control:focus { outline: none; border-color: #3498db; box-shadow: 0 0 0 3px rgba(52,152,219,0.1); }
        .btn-login { width: 100%; padding: 12px; background: linear-gradient(135deg, #3498db, #2980b9); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-login:hover { background: linear-gradient(135deg, #2980b9, #2471a3); }
        .error-message { background: #fee2e2; color: #e74c3c; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-top: 16px; text-align: center; display: none; }
        .success-message { background: #d1fae5; color: #065f46; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-top: 16px; text-align: center; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Reset Password</h2>
        <p>Please enter your new password below.</p>
        
        <form id="reset-form">
            <div class="form-group">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" class="form-control" required placeholder="請輸入新密碼">
                <div id="pwd-feedback" style="font-size:0.8rem; margin-top:5px;"></div>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm New Password</label>
                <input type="password" id="confirm-password" class="form-control" required placeholder="請再次輸入新密碼">
            </div>
            <button type="submit" class="btn-login" id="submit-btn">
                <i class="fas fa-key"></i> Reset Password
            </button>
            <div id="error-msg" class="error-message"></div>
            <div id="success-msg" class="success-message"></div>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('error-msg').textContent = '無效的連結，缺少 Token。';
            document.getElementById('error-msg').style.display = 'block';
            document.getElementById('reset-form').style.display = 'none';
        }

        document.getElementById('reset-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const newPwd = document.getElementById('new-password').value;
            const confirmPwd = document.getElementById('confirm-password').value;
            const btn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-msg');
            const successDiv = document.getElementById('success-msg');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (newPwd !== confirmPwd) {
                errorDiv.textContent = '兩次輸入的密碼不一致！';
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';

            try {
                // ★ 真實呼叫後端 API
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, newPassword: newPwd })
                });

                const data = await res.json();

                if (res.ok) {
                    successDiv.textContent = '✅ 密碼重設成功！即將跳轉回登入頁面...';
                    successDiv.style.display = 'block';
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                } else {
                    errorDiv.textContent = data.error === 'invalid_or_expired_token' 
                        ? 'Token 已失效或過期，請重新申請。' 
                        : (data.error || '重設失敗。');
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-key"></i> Reset Password';
                }
            } catch (err) {
                errorDiv.textContent = '伺服器連線失敗。';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-key"></i> Reset Password';
            }
        });
    </script>
</body>
</html>
