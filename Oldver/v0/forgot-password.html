<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AEL DWSS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { background: white; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); padding: 40px 32px; width: 100%; max-width: 420px; }
        .login-card h2 { color: #2c3e50; text-align: center; margin-bottom: 8px; }
        .login-card p { color: #7f8c8d; text-align: center; font-size: 0.9rem; margin-bottom: 24px; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #2c3e50; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        .form-control:focus { outline: none; border-color: #3498db; box-shadow: 0 0 0 3px rgba(52,152,219,0.1); }
        .btn-login { width: 100%; padding: 12px; background: linear-gradient(135deg, #3498db, #2980b9); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-login:hover { background: linear-gradient(135deg, #2980b9, #2471a3); transform: translateY(-2px); }
        .error-message { background: #fee2e2; color: #e74c3c; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-top: 16px; text-align: center; display: none; }
        .success-message { background: #d1fae5; color: #065f46; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-top: 16px; text-align: center; display: none; }
        .back-link { display: block; text-align: center; margin-top: 20px; font-size: 0.85rem; color: #64748b; text-decoration: none; }
        .back-link:hover { color: #3498db; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Forgot Password</h2>
        
        <!-- 步驟 1: 輸入 Email -->
        <div id="step-1">
            <p>Enter your registered email address to receive a verification code.</p>
            <form id="forgot-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="btn-login" id="submit-btn">
                    <i class="fas fa-paper-plane"></i> Send Code
                </button>
            </form>
        </div>

        <!-- 步驟 2: 輸入驗證碼 -->
        <div id="step-2" style="display: none;">
            <p>Please enter the 6-digit code sent to your email.</p>
            <form id="verify-form">
                <div class="form-group">
                    <label for="code">Verification Code</label>
                    <input type="text" id="code" class="form-control" placeholder="e.g. 123456" maxlength="6" required style="text-align: center; font-size: 24px; letter-spacing: 5px;">
                </div>
                <button type="submit" class="btn-login" id="verify-btn">
                    <i class="fas fa-check"></i> Verify Code
                </button>
            </form>
        </div>

        <!-- 錯誤與成功訊息 -->
        <div id="error-msg" class="error-message"></div>
        <div id="success-msg" class="success-message"></div>
        
        <a href="login.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </div>

    <script>
        let currentEmail = '';

        // --- 處理步驟 1：發送驗證碼 ---
        document.getElementById('forgot-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            currentEmail = document.getElementById('email').value.trim();
            const btn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-msg');
            const successDiv = document.getElementById('success-msg');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail })
                });

                if (res.ok) {
                    document.getElementById('step-1').style.display = 'none';
                    document.getElementById('step-2').style.display = 'block';
                    successDiv.textContent = '驗證碼已發送，請檢查您的信箱。';
                    successDiv.style.display = 'block';
                } else {
                    const data = await res.json();
                    errorDiv.textContent = data.message || data.error || '發送失敗。';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = '伺服器連線失敗。';
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Code';
            }
        });

        // --- 處理步驟 2：驗證碼確認 ---
        document.getElementById('verify-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const code = document.getElementById('code').value.trim();
            const btn = document.getElementById('verify-btn');
            const errorDiv = document.getElementById('error-msg');
            const successDiv = document.getElementById('success-msg');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            try {
                const res = await fetch('/api/auth/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, code: code })
                });

                const data = await res.json();

                if (res.ok && data.token) {
                    successDiv.textContent = '驗證成功！即將跳轉至重設密碼頁面...';
                    successDiv.style.display = 'block';
                    // 帶著後端給的 Token 跳轉到重設密碼頁面
                    setTimeout(() => {
                        window.location.href = `reset-password.html?token=${data.token}`;
                    }, 1000);
                } else {
                    errorDiv.textContent = data.message || '驗證碼錯誤或已過期。';
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check"></i> Verify Code';
                }
            } catch (err) {
                errorDiv.textContent = '伺服器連線失敗。';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Verify Code';
            }
        });
    </script>
</body>
</html>
