<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - AEL DWSS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/main.css">
    <script src="scripts/password.js"></script>
    <script src="scripts/password-lifecycle.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .change-pwd-container {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }
        .change-pwd-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .change-pwd-header .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #f39c12, #d35400);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 2rem;
        }
        .change-pwd-header h2 {
            color: #2c3e50;
            margin-bottom: 8px;
        }
        .change-pwd-header p {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        .reason-box {
            background: #fef3c7;
            border-left: 4px solid #f39c12;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 24px;
            color: #92400e;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        .pwd-feedback {
            margin-top: 6px;
            font-size: 0.82rem;
            min-height: 18px;
        }
        .pwd-feedback.invalid { color: #e74c3c; }
        .pwd-feedback.valid { color: #27ae60; }
        .pwd-requirements {
            background: #f8fafc;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 8px;
            font-size: 0.82rem;
        }
        .pwd-requirements ul {
            margin: 6px 0 0 0;
            padding-left: 20px;
            color: #64748b;
        }
        .pwd-requirements li.ok { color: #27ae60; }
        .pwd-requirements li.ok::before { content: '✓ '; }
        .pwd-requirements li.not-ok::before { content: '○ '; }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-submit:hover:not(:disabled) {
            background: linear-gradient(135deg, #2980b9, #2471a3);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .error-box {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.88rem;
            margin-bottom: 16px;
            display: none;
        }
        .error-box.show { display: block; }
        .contract-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.7rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="change-pwd-container">
        <div class="change-pwd-header">
            <div class="icon"><i class="fas fa-key"></i></div>
            <h2>Change Password</h2>
            <p>Please set a new password to continue</p>
        </div>

        <div class="reason-box" id="reason-box" style="display: none;"></div>
        <div class="error-box" id="error-box"></div>

        <form id="change-pwd-form">
            <div class="form-group">
                <label for="current-password">Current Password</label>
                <input type="password" id="current-password" required autocomplete="current-password">
            </div>

            <div class="form-group">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" required autocomplete="new-password">
                <div class="pwd-feedback" id="pwd-feedback"></div>
                <div class="pwd-requirements" id="pwd-requirements">
                    <strong>Requirements:</strong>
                    <ul>
                        <li id="req-length" class="not-ok">At least 8 characters</li>
                        <li id="req-upper" class="not-ok">At least 1 uppercase letter (A-Z)</li>
                        <li id="req-lower" class="not-ok">At least 1 lowercase letter (a-z)</li>
                        <li id="req-number" class="not-ok">At least 1 number (0-9)</li>
                        <li id="req-special" class="not-ok">At least 1 special character (!@#$%...)</li>
                    </ul>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm New Password</label>
                <input type="password" id="confirm-password" required autocomplete="new-password">
                <div class="pwd-feedback" id="confirm-feedback"></div>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn" disabled>
                <i class="fas fa-check"></i> Change Password
            </button>
        </form>

        <div class="contract-footer">
            AEL DWSS System — Contract No. DE/2024/12
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        var USERS_KEY = 'dwss_users_db';
        var currentUser = null;

        function loadCurrentUser() {
            var pending = sessionStorage.getItem('password_change_required');
            if (!pending) {
                alert('No password change request. Redirecting to login.');
                window.location.href = 'login.html';
                return null;
            }

            var info;
            try { info = JSON.parse(pending); } catch (e) {
                window.location.href = 'login.html';
                return null;
            }

            var users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
            var user = users.find(function (u) { return u.id === info.userId; });
            if (!user) {
                window.location.href = 'login.html';
                return null;
            }

            var reasonBox = document.getElementById('reason-box');
            if (info.message) {
                reasonBox.textContent = info.message;
                reasonBox.style.display = 'block';
            }

            return user;
        }

        function checkRequirements() {
            var pwd = document.getElementById('new-password').value;
            var result = DWSS_PasswordPolicy.check(pwd);

            updateReq('req-length', pwd.length >= 8);
            updateReq('req-upper', /[A-Z]/.test(pwd));
            updateReq('req-lower', /[a-z]/.test(pwd));
            updateReq('req-number', /[0-9]/.test(pwd));
            updateReq('req-special', /[!@#$%^&*(),.?":{}|<>\-_+=\[\]\\\/~`';]/.test(pwd));

            var fb = document.getElementById('pwd-feedback');
            if (pwd.length === 0) {
                fb.textContent = '';
                fb.className = 'pwd-feedback';
            } else if (result.valid) {
                fb.textContent = '✓ Password meets requirements';
                fb.className = 'pwd-feedback valid';
            } else {
                fb.textContent = '✗ ' + (result.errors[0] || 'Invalid');
                fb.className = 'pwd-feedback invalid';
            }

            return result.valid;
        }

        function updateReq(id, ok) {
            var el = document.getElementById(id);
            if (!el) return;
            el.className = ok ? 'ok' : 'not-ok';
        }

        function checkConfirm() {
            var pwd = document.getElementById('new-password').value;
            var confirm = document.getElementById('confirm-password').value;
            var fb = document.getElementById('confirm-feedback');

            if (!confirm) {
                fb.textContent = '';
                fb.className = 'pwd-feedback';
                return false;
            }
            if (pwd === confirm) {
                fb.textContent = '✓ Passwords match';
                fb.className = 'pwd-feedback valid';
                return true;
            } else {
                fb.textContent = '✗ Passwords do not match';
                fb.className = 'pwd-feedback invalid';
                return false;
            }
        }

        function updateSubmitState() {
            var valid = checkRequirements();
            var match = checkConfirm();
            var current = document.getElementById('current-password').value;
            document.getElementById('submit-btn').disabled = !(valid && match && current);
        }

        function showError(msg) {
            var box = document.getElementById('error-box');
            box.textContent = msg;
            box.classList.add('show');
            setTimeout(function () { box.classList.remove('show'); }, 5000);
        }

        function handleSubmit(e) {
            e.preventDefault();

            var currentPwd = document.getElementById('current-password').value;
            var newPwd = document.getElementById('new-password').value;

            if (currentPwd !== currentUser.password) {
                showError('Current password is incorrect.');
                return;
            }

            if (newPwd === currentPwd) {
                showError('New password must be different from current password.');
                return;
            }

            var result = DWSS_PasswordPolicy.check(newPwd);
            if (!result.valid) {
                showError(result.errors[0] || 'Password does not meet requirements.');
                return;
            }

            var update = DWSS_PasswordLifecycle.changePassword(currentUser.id, newPwd);
            if (!update.success) {
                showError('Failed to update password: ' + update.error);
                return;
            }

            sessionStorage.removeItem('password_change_required');
            alert('✅ Password changed successfully! You can now login.');
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', function () {
            currentUser = loadCurrentUser();
            if (!currentUser) return;

            document.getElementById('new-password').addEventListener('input', updateSubmitState);
            document.getElementById('confirm-password').addEventListener('input', updateSubmitState);
            document.getElementById('current-password').addEventListener('input', updateSubmitState);
            document.getElementById('change-pwd-form').addEventListener('submit', handleSubmit);
        });
    })();
    </script>
</body>
</html>
