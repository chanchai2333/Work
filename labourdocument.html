    <div class="main-content">
        <div class="header">

            <div class="header-controls">

                </div>
            </div>
        </div>

        <div class="document-view-page">
            <div class="document-header">
                <h2>

                    <span id="docTitle">Labour Wage Document</span>
                    <span class="doc-status status-draft" id="docStatus">Draft</span>
                </h2>
                <div class="document-actions">
                    <div class="download-dropdown">
                        <button class="btn btn-download" id="download-btn">
                            <i class="fas fa-download"></i> Download <i class="fas fa-chevron-down"></i>
                        </button>
                        <div class="dropdown-menu" id="download-menu">
                            <button data-format="pdf" id="download-pdf-option">
                                <i class="fas fa-file-pdf" style="color:#e74c3c;"></i>
                                <span>Download as PDF</span>
                            </button>
                            <button data-format="xlsx" id="download-xlsx-option">
                                <i class="fas fa-file-excel" style="color:#217346;"></i>
                                <span>Download as Excel (.xlsx)</span>
                            </button>
                        </div>
                    </div>
                    <button class="btn btn-print" id="print-pdf-btn"><i class="fas fa-print"></i> Print</button>
                    <button class="btn btn-primary" id="back-btn"><i class="fas fa-arrow-left"></i> Back</button>
                </div>
            </div>

            <div class="document-meta">
                <div class="meta-item"><span class="meta-label">Document ID:</span><span class="meta-value" id="docId">N/A</span></div>
                <div class="meta-item"><span class="meta-label">Document Type:</span><span class="meta-value" id="docType">N/A</span></div>

            </div>

            <div class="pdf-editor-container">
                <div class="pdf-controls" id="pdf-controls" style="display:none;">
                    <span id="page-nav" style="display:none; align-items:center; gap:10px;">
                    <button class="nav-btn" id="prev-page"><i class="fas fa-chevron-left"></i></button>
                    <span class="page-info">
                        Page
                        <input type="number" id="page-input" class="page-input" min="1" value="1">
                        of <span id="total-pages">1</span>
                    </span>
                    <span id="current-page" style="display:none;">1</span>
                    <button class="nav-btn" id="next-page"><i class="fas fa-chevron-right"></i></button>
                </div>

                <div class="pdf-canvas-container" id="pdf-container">
                    <div class="loading-indicator" id="loading-indicator">
                        <i class="fas fa-spinner fa-spin"></i> <span id="loading-text">Loading...</span>
                    </div>
                    <div class="error-message" id="error-message">
                        <i class="fas fa-exclamation-triangle" style="font-size:32px;"></i><br><br>
                        <strong>Failed to load document.</strong>
                    </div>
                    <div id="page-wrapper"></div>
                </div>
            </div>

            <footer>

                <p>AEL DWSS Platform</p>
            </footer>

                    if (patches[f.id].top    !== undefined) f.top    = patches[f.id].top;

                    if (patches[f.id].height !== undefined) f.height = patches[f.id].height;
                }
            });

            for (var id in patches) {
                if (!patches.hasOwnProperty(id)) continue;
                if (seen[id]) continue;
                var p = patches[id];
                arr.push({
                    id: id,
                    left: p.left,
                    top: p.top,
                    width: p.width,
                    height: p.height,
                    type: p.type
                });
            }

        function computeOverlayFontSize(docType, fieldId, fieldType) {
            var pw = _overlayPageWidth;
            var isCheck = (fieldType === 'check');

            if (docType === 'GF527A') {
                return isCheck ? (pw * 0.0196) : (pw * 0.0154);
            }

            if (docType === 'GF527-2017') {
                if (fieldId === 'g17_01' || fieldId === 'g17_02' ||
                    fieldId === 'g17_05' || fieldId === 'g17_06' ||
                    fieldId === 'g17_07' || fieldId === 'g17_08') {
                    return pw * 0.00786;
                }
                if (fieldId === 'g17_03' || fieldId === 'g17_04') {
                    return pw * 0.00571;
                }
                return isCheck ? (pw * 0.00635) : (pw * 0.0050);
            }

            if (docType === 'GF527-2003') {
                return isCheck ? (pw * 0.00635) : (pw * 0.0050);
            }

            return pw * 0.0154;
        }

        function buildOverlayElement(docType, pageNum, formData, forPrint) {
            var fields = getLayoutForPage(docType, pageNum);
            if (!fields || !fields.length) {
                console.warn('[LabourDoc] ⚠ 找不到 layout 欄位，無法繪製覆蓋層');
                return null;
            }

            var overlay = document.createElement('div');
            overlay.className = 'pdf-view-overlay';
            if (forPrint) overlay.style.background = 'transparent';

            var count = 0;

            fields.forEach(function (f) {
                var val = formData[f.id];
                if (val === undefined || val === null) return;

                var strVal = String(val).trim();
                if (strVal === '') return;

                var fontSizePx = computeOverlayFontSize(docType, f.id, f.type);
                var isSignatureImage = strVal.indexOf('data:image') === 0;

                if (isSignatureImage) {
                    var sigEl = document.createElement('div');
                    sigEl.className = 'pdf-view-field signature';
                    sigEl.dataset.fieldId = f.id;
                    sigEl.style.left   = f.left;
                    sigEl.style.top    = f.top;
                    sigEl.style.width  = f.width;
                    sigEl.style.height = f.height;
                    sigEl.style.padding = '0';
                    sigEl.style.justifyContent = 'center';
                    sigEl.style.overflow = 'hidden';

                    var sigImg = document.createElement('img');
                    sigImg.src = strVal;
                    sigImg.alt = '簽名';
                    sigImg.style.cssText =
                        'max-width:100%;max-height:100%;width:100%;height:100%;' +
                        'object-fit:contain;display:block;pointer-events:none;';
                    sigEl.appendChild(sigImg);
                    overlay.appendChild(sigEl);
                    count++;
                    return;
                }

                if (f.type === 'signature') {
                    var el = document.createElement('div');
                    el.className = 'pdf-view-field';
                    el.dataset.fieldId = f.id;
                    el.style.left   = f.left;
                    el.style.top    = f.top;
                    el.style.width  = f.width;
                    el.style.height = f.height;
                    el.style.fontSize = fontSizePx.toFixed(2) + 'px';
                    el.textContent = strVal;
                    el.title = strVal;
                    overlay.appendChild(el);
                    count++;
                    return;
                }

                var isCheck = (f.type === 'check');

                if (isCheck) {
                    var chkEl = document.createElement('div');
                    chkEl.className = 'pdf-view-field check';
                    chkEl.dataset.fieldId = f.id;
                    chkEl.style.left   = f.left;
                    chkEl.style.top    = f.top;
                    chkEl.style.width  = f.width;
                    chkEl.style.height = f.height;
                    chkEl.style.fontSize = fontSizePx.toFixed(2) + 'px';
                    chkEl.textContent = '✓';
                    overlay.appendChild(chkEl);
                    count++;
                    return;
                }

                var el = document.createElement('div');
                el.className = 'pdf-view-field';
                el.dataset.fieldId = f.id;
                el.style.left   = f.left;
                el.style.top    = f.top;
                el.style.width  = f.width;
                el.style.height = f.height;
                el.style.fontSize = fontSizePx.toFixed(2) + 'px';
                el.textContent = strVal;
                el.title = strVal;
                overlay.appendChild(el);
                count++;
            });

            return count > 0 ? overlay : null;
        }

        function injectViewOverlay(pageDiv, pageNum) {
            if (!currentDoc) return;

        function buildHtmlTableFromWorkbook(ws) {
            var range = XLSX.utils.decode_range(ws['!ref'] || 'A1:A1');
            var merges = ws['!merges'] || [];
            var mergeStarts = {}, covered = {};
            merges.forEach(function (m) {
                var key = m.s.r + ',' + m.s.c;
                mergeStarts[key] = { rowspan: m.e.r - m.s.r + 1, colspan: m.e.c - m.s.c + 1 };
                for (var r = m.s.r; r <= m.e.r; r++) {
                    for (var c = m.s.c; c <= m.e.c; c++) {
                        if (r === m.s.r && c === m.s.c) continue;
                        covered[r + ',' + c] = true;
                    }
                }
            });
            var colWidths = [];
            if (ws['!cols']) {
                for (var ci = range.s.c; ci <= range.e.c; ci++) {
                    var col = ws['!cols'][ci];
                    if (col) {
                        if (col.wch) colWidths[ci] = Math.round(col.wch * 7.2) + 'px';
                        else if (col.wpx) colWidths[ci] = col.wpx + 'px';
                        else if (col.width) colWidths[ci] = Math.round(col.width * 7.2) + 'px';
                    }
                }
            }
            var html = '<table style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;font-size:10.5px;background:#fff;color:#000;">';
            if (colWidths.length) {
                html += '<colgroup>';
                for (var cc = range.s.c; cc <= range.e.c; cc++) {
                    html += '<col style="width:' + (colWidths[cc] || 'auto') + '">';
                }
                html += '</colgroup>';
            }
            for (var R = range.s.r; R <= range.e.r; R++) {
                html += '<tr>';
                for (var C = range.s.c; C <= range.e.c; C++) {
                    var key = R + ',' + C;
                    if (covered[key]) continue;
                    var addr = XLSX.utils.encode_cell({ r: R, c: C });
                    var cell = ws[addr];
                    var text = '';
                    if (cell) {
                        if (cell.w !== undefined && cell.w !== null) text = String(cell.w);
                        else if (cell.v !== undefined && cell.v !== null) text = String(cell.v);
                        else if (cell.f) text = '=' + cell.f;
                    }
                    text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
                    var m = mergeStarts[key];
                    var rowspan = m ? ' rowspan="' + m.rowspan + '"' : '';
                    var colspan = m ? ' colspan="' + m.colspan + '"' : '';
                    var isHeader = (R <= (range.s.r + 2));
                    html += '<td' + rowspan + colspan + ' style="border:1px solid #888;padding:2px 4px;vertical-align:middle;' +
                            (isHeader ? 'font-weight:700;text-align:center;' : '') + '">' + text + '</td>';
                }
                html += '</tr>';
            }
            html += '</table>';
            return html;
        }

        function xlsxBase64ToPdfBlob(xlsxB64) {
            return new Promise(function (resolve, reject) {
                setLoading('正在解析 Excel...');
                try {
                    var bytes = base64ToUint8(xlsxB64);
                    var wb = XLSX.read(bytes, { type: 'array', cellStyles: true, cellFormula: true, cellNF: true, cellDates: false });
                    if (!wb || !wb.SheetNames || !wb.SheetNames.length) { reject(new Error('無工作表')); return; }
                    var ws = wb.Sheets[wb.SheetNames[0]];
                    var html = buildHtmlTableFromWorkbook(ws);
                    var container = document.createElement('div');
                    container.innerHTML = html;
                    container.style.cssText = 'position:fixed;left:-99999px;top:0;background:#ffffff;padding:16px;display:inline-block;';
                    document.body.appendChild(container);
                    setTimeout(function () {
                        setLoading('轉換為 PDF...');
                        html2canvas(container, {
                            scale: 2, backgroundColor: '#ffffff', logging: false,
                            windowWidth: container.scrollWidth, windowHeight: container.scrollHeight
                        }).then(function (canvas) {
                            if (container.parentNode) container.parentNode.removeChild(container);
                            var imgData = canvas.toDataURL('image/jpeg', 0.92);
                            var aspect = canvas.width / canvas.height;
                            var pdfW = A3_W_MM, pdfH = A3_H_MM;
                            if (aspect > (A3_W_MM / A3_H_MM)) pdfH = pdfW / aspect;
                            else pdfW = pdfH * aspect;
                            var jsPDFCtor = window.jspdf.jsPDF;
                            var pdf = new jsPDFCtor({ orientation: 'landscape', unit: 'mm', format: [pdfW, pdfH], compress: true });
                            var margin = 4;
                            var imgW = pdfW - margin * 2;
                            var imgH = imgW / aspect;
                            if (imgH > pdfH - margin * 2) { imgH = pdfH - margin * 2; imgW = imgH * aspect; }
                            pdf.addImage(imgData, 'JPEG', (pdfW - imgW) / 2, (pdfH - imgH) / 2, imgW, imgH, undefined, 'FAST');
                            resolve(pdf.output('blob'));
                        }).catch(function (err) {
                            if (container.parentNode) container.parentNode.removeChild(container);
                            reject(err);
                        });
                    }, 100);
                } catch (e) { reject(e); }
            });
        }

        async function preparePdfBlob(doc) {
            if (!doc) throw new Error('缺少文件');
            var type = doc.type;

            if (type === 'GF527A') {
                var b64A = window.LABOURWAGE_BASE64 || window.SITE_DIARY_TEMPLATE_BASE64 || window.GF527A_BASE64;
                if (!b64A || b64A.length < 100) b64A = sessionStorage.getItem('labour_template_GF527A');
                if (!b64A || b64A.length < 100) throw new Error('找不到 GF527A PDF');
                setLoading('載入 GF527A PDF...');
                return new Blob([base64ToUint8(b64A)], { type: 'application/pdf' });
            }
            if (type === 'GF527-2017') {
                var b64_17 = window.GF527_2017_BASE64;
                if (b64_17 && b64_17.length > 100 && b64_17.substring(0, 12).indexOf('JVBERi0') === 0) {
                    setLoading('載入 GF527-2017 PDF...');
                    return new Blob([base64ToUint8(b64_17)], { type: 'application/pdf' });
                }
                var xlsxB64 = (doc.excelData && doc.excelData.length > 100) ? doc.excelData : window.GF527_REV_1_2017_PROTECTED_FONT_SIZE_26_BASE64;
                if (!xlsxB64 || xlsxB64.length < 100) throw new Error('找不到 GF527-2017 資料');
                setLoading('轉換 GF527-2017...');
                return await xlsxBase64ToPdfBlob(xlsxB64);
            }
            if (type === 'GF527-2003') {
                if (window.GF527_2003_BASE64 && window.GF527_2003_BASE64.length > 100) {
                    setLoading('載入 GF527-2003 PDF...');
                    return new Blob([base64ToUint8(window.GF527_2003_BASE64)], { type: 'application/pdf' });
                }
                throw new Error('找不到 GF527-2003 PDF');
            }
            if (doc.pdfData && doc.pdfData.length > 100) {
                return new Blob([base64ToUint8(doc.pdfData)], { type: 'application/pdf' });
            }
            throw new Error('不支援的文件類型: ' + type);
        }

        async function renderPdfBlobToImages(blob) {
            setLoading('渲染 PDF 頁面...');
            var ab = await blob.arrayBuffer();
            var pdf = await pdfjsLib.getDocument({ data: ab }).promise;
            totalVirtualPages = pdf.numPages;
            pageImages = [];
            pageAspects = [];
            for (var i = 1; i <= pdf.numPages; i++) {
                setLoading('渲染第 ' + i + '/' + pdf.numPages + ' 頁...');
                var page = await pdf.getPage(i);
                var viewport = page.getViewport({ scale: PDF_RENDER_SCALE });
                var canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                var ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                pageImages.push(canvas.toDataURL('image/png'));
                pageAspects.push(viewport.height / viewport.width);
            }
        }

        function renderPage(pageNum) {
            if (!pageImages.length) return;
            if (pageNum < 1 || pageNum > totalVirtualPages) return;
            activePageNum = pageNum;
            pageWrapper.innerHTML = '';

            var aspect = pageAspects[pageNum - 1] || 1.4142;

            var pageWidth;
            if (storedPageWidth && storedPageWidth > 100) {
                pageWidth = storedPageWidth;
            } else {
                var cw = pdfContainer ? pdfContainer.clientWidth : 0;
                pageWidth = (cw > 100) ? (cw - 48) : FALLBACK_PAGE_WIDTH;
                if (pageWidth > 1600) pageWidth = 1600;
                if (pageWidth < 600) pageWidth = 600;
            }

            var cw2 = pdfContainer ? pdfContainer.clientWidth : 0;
            if (cw2 > 100 && pageWidth > cw2 - 48) {
                pageWidth = cw2 - 48;
            }

            setOverlayPageWidth(pageWidth);

            var pageHeight = Math.round(pageWidth * aspect);

            var pageDiv = document.createElement('div');
            pageDiv.className = 'pdf-page active-page';
            pageDiv.dataset.page = pageNum;
            pageDiv.style.width = pageWidth + 'px';
            pageDiv.style.height = pageHeight + 'px';

            var img = document.createElement('img');
            img.src = pageImages[pageNum - 1];
            img.alt = 'Page ' + pageNum;
            img.draggable = false;
            pageDiv.appendChild(img);

            injectViewOverlay(pageDiv, pageNum);
            pageWrapper.appendChild(pageDiv);
            updatePageInfo();
        }

        function updatePageInfo() {
            if (totalPagesEl) totalPagesEl.textContent = totalVirtualPages;
            if (currentPageEl) currentPageEl.textContent = activePageNum;
            if (pageInput) { pageInput.value = activePageNum; pageInput.max = totalVirtualPages; }

        function setupRecordNavigation() {
            var params = new URLSearchParams(location.search);
            var id = params.get('id') || (currentDoc && currentDoc.id);
            fetch('/api/records/wage/list', { cache: 'no-store' })
                .then(function (res) { return res.ok ? res.json() : []; })
                .then(function (list) {
                    var projectId = sessionStorage.getItem('currentProjectId') || '';
                    var records = (Array.isArray(list) ? list : []).filter(function (r) {
                        return r && r.id && (!projectId || r.project === projectId || String(r.id).indexOf(projectId.replace(/\//g, '-')) !== -1);
                    });
                    records.sort(function (a, b) { return String(a.id).localeCompare(String(b.id)); });
                    var index = 0;
                    for (var i = 0; i < records.length; i++) if (String(records[i].id) === String(id)) index = i;
                    var cur = document.getElementById('record-current');
                    var total = document.getElementById('record-total');
                    if (cur) cur.textContent = String(index + 1);
                    if (total) total.textContent = String(records.length || 1);
                    function go(n) {
                        if (!records.length) return;
                        var next = Math.max(0, Math.min(records.length - 1, n));
                        if (String(records[next].id) === String(id)) return;
                        window.location.href = 'labourdocument.html?id=' + encodeURIComponent(records[next].id);
                    }
                    var prev = document.getElementById('prev-record');
                    var next = document.getElementById('next-record');
                    if (prev) prev.addEventListener('click', function () { go(index - 1); });
                    if (next) next.addEventListener('click', function () { go(index + 1); });
                });
        }

        function setupNavigation() {
            if (prevBtn) prevBtn.addEventListener('click', function () {
                if (activePageNum > 1) renderPage(activePageNum - 1);
            });
            if (nextBtn) nextBtn.addEventListener('click', function () {
                if (activePageNum < totalVirtualPages) renderPage(activePageNum + 1);
            });
            if (pageInput) pageInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    var t = parseInt(pageInput.value, 10);
                    if (!isNaN(t) && t >= 1 && t <= totalVirtualPages) renderPage(t);
                    else { alert('請輸入 1 到 ' + totalVirtualPages); pageInput.value = activePageNum; }
                    pageInput.blur();
                } else if (e.key === 'Escape') { pageInput.value = activePageNum; pageInput.blur(); }
            });
        }

        function downloadBlob(blob, filename) {
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
        }

        async function buildPageWithOverlay(pageIndex) {
            var aspect = pageAspects[pageIndex - 1] || 1.4142;

            var pageWidth = storedPageWidth && storedPageWidth > 100 ? storedPageWidth : FALLBACK_PAGE_WIDTH;
            var cw = pdfContainer ? pdfContainer.clientWidth : 0;
            if (cw > 100 && pageWidth > cw - 48) pageWidth = cw - 48;
            if (pageWidth < 600) pageWidth = 600;

            var pageHeight = Math.round(pageWidth * aspect);

            var wrapper = document.createElement('div');
            wrapper.className = 'labour-capture-wrapper';
            wrapper.style.cssText =
                'position:absolute;top:0;left:-200vw;' +
                'width:' + pageWidth + 'px;height:' + pageHeight + 'px;' +
                'background:#ffffff;overflow:hidden;';

            var img = document.createElement('img');
            img.src = pageImages[pageIndex - 1];
            img.alt = 'Page ' + pageIndex;
            img.draggable = false;
            img.style.cssText =
                'position:absolute;top:0;left:0;' +
                'width:100%;height:100%;display:block;' +
                'pointer-events:none;user-select:none;';
            wrapper.appendChild(img);

            setOverlayPageWidth(pageWidth);

            var docType = currentDoc.type || 'GF527A';
            var formData = getFormData();
            var overlay = buildOverlayElement(docType, pageIndex, formData, true);
            if (overlay) wrapper.appendChild(overlay);

            document.body.appendChild(wrapper);

            try {
                if (typeof img.decode === 'function') {
                    await img.decode();
                } else if (!(img.complete && img.naturalWidth > 0)) {
                    await new Promise(function (resolve) {
                        img.addEventListener('load',  resolve, { once: true });
                        img.addEventListener('error', resolve, { once: true });
                    });
                }
            } catch (e) {}

            await new Promise(function (r) { requestAnimationFrame(r); });
            await new Promise(function (r) { setTimeout(r, 80); });

            return { element: wrapper, width: pageWidth, height: pageHeight };
        }

        async function downloadPdfWithOverlay() {
            if (!pageImages.length) { alert('尚未載入文件'); return; }
            if (typeof html2canvas === 'undefined' || !window.jspdf) {
                alert('PDF 引擎未載入'); return;
            }

            var btn = downloadBtn;
            var origHTML = btn ? btn.innerHTML : '';
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 產生 PDF...';
            }

            var tempEls = [];

            try {
                var jsPDFCtor = window.jspdf.jsPDF;

                var firstAspect = pageAspects[0] || 1.4142;
                var firstPortrait = firstAspect > 1.0;

                var A4_W = 210, A4_H = 297;

                var pdf = new jsPDFCtor({
                    orientation: firstPortrait ? 'portrait' : 'landscape',
                    unit: 'mm',
                    format: 'a4',
                    compress: true
                });

                var isFirstPage = true;

                for (var p = 1; p <= totalVirtualPages; p++) {
                    if (btn) {
                        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + p + '/' + totalVirtualPages;
                    }

                    var built = await buildPageWithOverlay(p);
                    tempEls.push(built.element);

                    var canvas = await html2canvas(built.element, {
                        scale: 2.5,
                        useCORS: true,
                        backgroundColor: '#ffffff',
                        logging: false,
                        width: built.width,
                        height: built.height,
                        windowWidth: built.width,
                        windowHeight: built.height
                    });

                    if (built.element && built.element.parentNode) {
                        built.element.parentNode.removeChild(built.element);
                        var idx = tempEls.indexOf(built.element);
                        if (idx !== -1) tempEls.splice(idx, 1);
                    }

                    var imgData = canvas.toDataURL('image/jpeg', 0.92);

                    var imgAspect = built.height / built.width;
                    var thisPortrait = imgAspect > 1.0;
                    var thisPageW = thisPortrait ? A4_W : A4_H;
                    var thisPageH = thisPortrait ? A4_H : A4_W;

                    if (isFirstPage) {
                        pdf.addImage(imgData, 'JPEG', 0, 0, thisPageW, thisPageH, undefined, 'FAST');
                        isFirstPage = false;
                    } else {
                        pdf.addPage([thisPageW, thisPageH], thisPortrait ? 'portrait' : 'landscape');
                        pdf.addImage(imgData, 'JPEG', 0, 0, thisPageW, thisPageH, undefined, 'FAST');
                    }
                }

                var blob = pdf.output('blob');
                console.log('[LabourDoc] ✓ PDF 產生完成 (' + (firstPortrait ? 'portrait' : 'landscape') + '): ' +
                            (blob.size / 1024).toFixed(0), 'KB');
                downloadBlob(blob, (currentDoc.id || 'LabourWage') + '.pdf');

            } catch (err) {
                console.error('[LabourDoc] downloadPdfWithOverlay failed:', err);
                alert('下載失敗：' + (err && err.message ? err.message : 'unknown'));
            } finally {
                tempEls.forEach(function (el) {
                    if (el && el.parentNode) el.parentNode.removeChild(el);
                });
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = origHTML;
                }
            }
        }

        function printPdf() {
            if (!pageImages.length) { alert('尚未載入'); return; }

            var formData = getFormData();
            var docType = currentDoc.type || 'GF527A';
            var firstAspect = pageAspects[0] || 1.4142;
            var isPortrait = firstAspect > 1.0;

            var pageW_mm = isPortrait ? 210 : 297;
            var pageH_mm = isPortrait ? 297 : 210;

            // 設定 overlay 字體計算的基準寬度 (A4 寬度約為 1122px)
            setOverlayPageWidth(pageW_mm * 3.7795);

            // 動態生成獨立的列印用 HTML
            var printHtml = '<!DOCTYPE html><html><head><style>';
            printHtml += '@page { size: A4 ' + (isPortrait ? 'portrait' : 'landscape') + '; margin: 0; }';
            printHtml += 'html, body { margin: 0; padding: 0; background: #fff; -webkit-print-color-adjust: exact; }';
            printHtml += '.print-page { width: 100%; height: 100vh; page-break-after: always; position: relative; overflow: hidden; background: #fff; }';
            printHtml += '.print-page:last-child { page-break-after: auto; }';
            printHtml += '.print-page img.bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }';
            printHtml += '.pdf-view-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 30; }';
            printHtml += '.pdf-view-field { position: absolute; color: #0a1a5c; font-family: Arial, sans-serif; font-weight: 600; padding: 1px 3px; line-height: 1.2; box-sizing: border-box; overflow: hidden; white-space: nowrap; display: flex; align-items: center; justify-content: flex-start; text-align: left; }';
            printHtml += '.pdf-view-field.check { justify-content: center; color: #0a1a5c; font-weight: 900; }';
            printHtml += '</style></head><body>';

            for (var p = 1; p <= totalVirtualPages; p++) {
                printHtml += '<div class="print-page">';
                printHtml += '<img class="bg" src="' + pageImages[p - 1] + '" />';
                
                var fields = getLayoutForPage(docType, p);
                if (fields && fields.length) {
                    printHtml += '<div class="pdf-view-overlay">';
                    fields.forEach(function (f) {
                        var val = formData[f.id];
                        if (val === undefined || val === null) return;
                        var strVal = String(val).trim();
                        if (strVal === '') return;

                        var fontSizePx = computeOverlayFontSize(docType, f.id, f.type);
                        var isSignatureImage = strVal.indexOf('data:image') === 0;

                        if (isSignatureImage) {
                            printHtml += '<div class="pdf-view-field signature" style="left:' + f.left + '; top:' + f.top + '; width:' + f.width + '; height:' + f.height + '; padding:0; justify-content:center; overflow:hidden;">';
                            printHtml += '<img src="' + strVal + '" style="max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;display:block;" />';
                            printHtml += '</div>';
                            return;
                        }

                        if (f.type === 'signature') {
                            printHtml += '<div class="pdf-view-field" style="left:' + f.left + '; top:' + f.top + '; width:' + f.width + '; height:' + f.height + '; font-size:' + fontSizePx.toFixed(2) + 'px;">';
                            printHtml += strVal;
                            printHtml += '</div>';
                            return;
                        }

                        if (f.type === 'check') {
                            printHtml += '<div class="pdf-view-field check" style="left:' + f.left + '; top:' + f.top + '; width:' + f.width + '; height:' + f.height + '; font-size:' + fontSizePx.toFixed(2) + 'px;">✓</div>';
                            return;
                        }

                        printHtml += '<div class="pdf-view-field" style="left:' + f.left + '; top:' + f.top + '; width:' + f.width + '; height:' + f.height + '; font-size:' + fontSizePx.toFixed(2) + 'px;">';
                        printHtml += strVal;
                        printHtml += '</div>';
                    });
                    printHtml += '</div>';
                }
                printHtml += '</div>';
            }
            printHtml += '</body></html>';

            // 建立隱藏的 iframe 進行列印
            var iframe = document.createElement('iframe');
            iframe.style.position = 'fixed';
            iframe.style.right = '0';
            iframe.style.bottom = '0';
            iframe.style.width = '0px';
            iframe.style.height = '0px';
            iframe.style.border = 'none';
            iframe.style.zIndex = '-9999';
            document.body.appendChild(iframe);

            var iframeDoc = iframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(printHtml);
            iframeDoc.close();

            setTimeout(function() {
                iframe.contentWindow.focus();
                iframe.contentWindow.print();
                
                // 列印對話框關閉後移除 iframe
                setTimeout(function() {
                    if (document.body.contains(iframe)) {
                        document.body.removeChild(iframe);
                    }
                }, 1000);
            }, 300);
        }

        document.addEventListener('DOMContentLoaded', async function () {
            if (window.DWSS_Auth) DWSS_Auth.updateHeaderUser();
            try {
                syncGlobalDate();
                setupSidebar();
                setupDownloadMenu();

                var params = new URLSearchParams(location.search);
                var doc = await loadWageFromServer(params.get('id'));
                if (!doc) doc = getCurrentDoc();
                if (!doc) { showError('找不到文件資料。請從 Labour Wage 列表重新點 View 進入。'); return; }
                currentDoc = doc;
                console.log('[LabourDoc] ===== 載入 ===== id=' + doc.id + ' type=' + doc.type);
                console.log('[LabourDoc] 取得的 doc:', doc);

                updateDocInfo(doc);
                setLoading('載入中...');

                var blob = await preparePdfBlob(doc);
                currentPdfBlob = blob;
                await renderPdfBlobToImages(blob);

                hideLoading();
                pdfControls.style.display = 'flex';
                requestAnimationFrame(function () { renderPage(1); });
                setupNavigation();
                setupRecordNavigation();

                var printBtn = document.getElementById('print-pdf-btn');
                if (printBtn) printBtn.addEventListener('click', printPdf);

                var backBtn = document.getElementById('back-btn');
                if (backBtn) backBtn.addEventListener('click', function () { window.location.href = 'labourwage.html'; });

            } catch (err) {
                console.error('[LabourDoc] Init failed:', err);
                showError('載入失敗：' + (err && err.message ? err.message : 'unknown'));
            }
        });

    })();
    </script>
</body>
</html>
